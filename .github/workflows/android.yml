name: Android
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']

env:
  # ccache is shared between runs, so unchanged C/C++ translation units are
  # not recompiled by the NDK at all.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_NOHASHDIR: "true"
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
  CCACHE_MAXSIZE: 3G

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Caches Gradle User Home (dependencies + local build cache) and
          # configures the Gradle build cache for this run.
          cache-read-only: false
          gradle-home-cache-cleanup: true
      - name: Install ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          ccache --version | head -n 1
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('android/TMessagesProj/jni/**', 'android/TMessagesProj/build.gradle') }}
          restore-keys: |
            ccache-${{ runner.os }}-
      - name: Restore compiled classes
        id: classes-restore
        uses: actions/cache/restore@v4
        with:
          # Class output + javac's incremental state + buildSrc. Restoring both
          # lets javac recompile only changed files instead of the whole module.
          path: |
            android/TMessagesProj/build/intermediates/javac
            android/TMessagesProj/build/tmp/compileDebugJavaWithJavac
            android/TMessagesProj/build/classes
            android/buildSrc/build
          key: classes-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            classes-${{ runner.os }}-
      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon \
            -PdgAbis=arm64-v8a \
            -PdgCcache \
            -Dorg.gradle.workers.max=4
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - uses: actions/upload-artifact@v4
        with:
          name: DeltaGram-debug
          path: android/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
      - name: Save ccache
        # actions/cache skips its save step when the job fails, which is why
        # the first failed run left the cache empty. Save it no matter what.
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('android/TMessagesProj/jni/**', 'android/TMessagesProj/build.gradle') }}
      - name: Save compiled classes
        # A fresh key every run, restored through the prefix, so the cache
        # always reflects the latest commit.
        if: always() && steps.classes-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            android/TMessagesProj/build/intermediates/javac
            android/TMessagesProj/build/tmp/compileDebugJavaWithJavac
            android/TMessagesProj/build/classes
            android/buildSrc/build
          key: classes-${{ runner.os }}-${{ github.run_id }}
